name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hireflow
          POSTGRES_PASSWORD: hireflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hireflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      HIREFLOW_TEST_POSTGRES: ${{ matrix.database == 'postgres' && 'Host=localhost;Username=hireflow;Password=hireflow' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.database }}
          path: tests/**/TestResults/**

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t hireflow-api:ci .

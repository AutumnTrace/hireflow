version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      hotchocolate:
        patterns: ["HotChocolate.*"]
      microsoft:
        patterns: ["Microsoft.*", "Npgsql.*"]
      test:
        patterns: ["xunit*", "coverlet.*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

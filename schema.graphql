schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Query {
  applications(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: JobApplicationFilterInput @cost(weight: "10")
    order: [JobApplicationSortInput!] @cost(weight: "10")
  ): ApplicationsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  application(id: UUID!): JobApplication @cost(weight: "10")
  candidates(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: CandidateFilterInput @cost(weight: "10")
    order: [CandidateSortInput!] @cost(weight: "10")
  ): CandidatesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  candidate(id: UUID!): Candidate @cost(weight: "10")
  companies(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: CompanyFilterInput @cost(weight: "10")
    order: [CompanySortInput!] @cost(weight: "10")
  ): CompaniesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  company(id: UUID!): Company @cost(weight: "10")
  interviews(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: InterviewFilterInput @cost(weight: "10")
    order: [InterviewSortInput!] @cost(weight: "10")
  ): InterviewsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  upcomingInterviews(days: Int! = 7, interviewer: String): [Interview!]!
    @cost(weight: "10")
  jobs(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: JobPostingFilterInput @cost(weight: "10")
    order: [JobPostingSortInput!] @cost(weight: "10")
  ): JobsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  job(id: UUID!): JobPosting @cost(weight: "10")
}

type Mutation {
  submitApplication(input: SubmitApplicationInput!): SubmitApplicationPayload!
    @cost(weight: "10")
  moveApplication(input: MoveApplicationInput!): MoveApplicationPayload!
    @cost(weight: "10")
  registerCandidate(input: RegisterCandidateInput!): RegisterCandidatePayload!
    @cost(weight: "10")
  createCompany(input: CreateCompanyInput!): CreateCompanyPayload!
    @cost(weight: "10")
  scheduleInterview(input: ScheduleInterviewInput!): ScheduleInterviewPayload!
    @cost(weight: "10")
  submitInterviewFeedback(input: SubmitInterviewFeedbackInput!): SubmitInterviewFeedbackPayload!
    @cost(weight: "10")
  createJobPosting(input: CreateJobPostingInput!): CreateJobPostingPayload!
    @cost(weight: "10")
  publishJobPosting(input: PublishJobPostingInput!): PublishJobPostingPayload!
    @cost(weight: "10")
  closeJobPosting(input: CloseJobPostingInput!): CloseJobPostingPayload!
    @cost(weight: "10")
}

type Subscription {
  onApplicationStageChanged(jobPostingId: UUID!): ApplicationStageChanged!
    @cost(weight: "10")
  onApplicationSubmitted(jobPostingId: UUID!): JobApplication!
    @cost(weight: "10")
}

type ApplicationClosedError implements Error {
  message: String!
  applicationId: UUID!
  stage: ApplicationStage!
}

"A connection to a list of items."
type ApplicationsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [ApplicationsEdge!]
  "A flattened list of the nodes."
  nodes: [JobApplication!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type ApplicationsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: JobApplication!
}

type ApplicationStageChanged {
  applicationId: UUID!
  jobPostingId: UUID!
  from: ApplicationStage
  to: ApplicationStage!
  note: String
  changedAt: DateTime!
  application: JobApplication! @cost(weight: "10")
}

type Candidate {
  applications: [JobApplication!]! @cost(weight: "10")
  recommendedJobs(limit: Int! = 5): [JobRecommendation!]! @cost(weight: "10")
  id: UUID!
  fullName: String!
  email: String!
  headline: String
  yearsOfExperience: Int!
  skills: [String!]!
  createdAt: DateTime!
}

"A connection to a list of items."
type CandidatesConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [CandidatesEdge!]
  "A flattened list of the nodes."
  nodes: [Candidate!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type CandidatesEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: Candidate!
}

type CloseJobPostingPayload {
  jobPosting: JobPosting
  errors: [CloseJobPostingError!]
}

"A connection to a list of items."
type CompaniesConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [CompaniesEdge!]
  "A flattened list of the nodes."
  nodes: [Company!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type CompaniesEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: Company!
}

type Company {
  jobs(status: JobStatus): [JobPosting!]! @cost(weight: "10")
  id: UUID!
  name: String!
  website: String
  industry: String
  location: String
  createdAt: DateTime!
}

type CreateCompanyPayload {
  company: Company
  errors: [CreateCompanyError!]
}

type CreateJobPostingPayload {
  jobPosting: JobPosting
  errors: [CreateJobPostingError!]
}

type DomainValidationError implements Error {
  message: String!
  field: String!
}

type DuplicateApplicationError implements Error {
  message: String!
  jobPostingId: UUID!
  candidateId: UUID!
}

type DuplicateCandidateError implements Error {
  message: String!
  email: String!
}

type DuplicateCompanyError implements Error {
  message: String!
  name: String!
}

type EntityNotFoundError implements Error {
  message: String!
  entity: String!
  entityId: UUID!
}

type Interview {
  application: JobApplication! @cost(weight: "10")
  id: UUID!
  applicationId: UUID!
  kind: InterviewKind!
  scheduledAt: DateTime!
  durationMinutes: Int!
  interviewer: String!
  rating: Int
  feedback: String
  feedbackSubmittedAt: DateTime
}

"A connection to a list of items."
type InterviewsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [InterviewsEdge!]
  "A flattened list of the nodes."
  nodes: [Interview!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type InterviewsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: Interview!
}

type InvalidStageTransitionError implements Error {
  message: String!
  applicationId: UUID!
  from: ApplicationStage!
  to: ApplicationStage!
  allowedStages: [ApplicationStage!]!
}

type JobApplication {
  job: JobPosting! @cost(weight: "10")
  candidate: Candidate! @cost(weight: "10")
  history: [StageTransition!]! @cost(weight: "10")
  interviews: [Interview!]! @cost(weight: "10")
  skillMatch: SkillMatch! @cost(weight: "10")
  allowedNextStages: [ApplicationStage!]!
  id: UUID!
  jobPostingId: UUID!
  candidateId: UUID!
  stage: ApplicationStage!
  coverLetter: String
  appliedAt: DateTime!
  updatedAt: DateTime!
  isActive: Boolean!
}

type JobPosting {
  company: Company! @cost(weight: "10")
  applications(stage: ApplicationStage): [JobApplication!]! @cost(weight: "10")
  pipeline: PipelineStats! @cost(weight: "10")
  id: UUID!
  companyId: UUID!
  title: String!
  description: String!
  location: String
  workMode: WorkMode!
  employmentType: EmploymentType!
  salary: SalaryRange
  requiredSkills: [String!]!
  status: JobStatus!
  createdAt: DateTime!
  publishedAt: DateTime
  closedAt: DateTime
}

type JobRecommendation {
  job: JobPosting!
  match: SkillMatch!
}

"A connection to a list of items."
type JobsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [JobsEdge!]
  "A flattened list of the nodes."
  nodes: [JobPosting!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type JobsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: JobPosting!
}

type JobStatusError implements Error {
  message: String!
  jobId: UUID!
  status: JobStatus!
}

type MoveApplicationPayload {
  jobApplication: JobApplication
  errors: [MoveApplicationError!]
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
}

type PipelineStats {
  total: Int!
  byStage: [StageCount!]!
  hireRate: Float!
}

type PublishJobPostingPayload {
  jobPosting: JobPosting
  errors: [PublishJobPostingError!]
}

type RegisterCandidatePayload {
  candidate: Candidate
  errors: [RegisterCandidateError!]
}

type SalaryRange {
  min: Int!
  max: Int!
  currency: String!
}

type ScheduleInterviewPayload {
  interview: Interview
  errors: [ScheduleInterviewError!]
}

type SkillMatch {
  score: Float!
  matchedSkills: [String!]!
  missingSkills: [String!]!
}

type StageCount {
  stage: ApplicationStage!
  count: Int!
}

type StageTransition {
  id: UUID!
  applicationId: UUID!
  from: ApplicationStage
  to: ApplicationStage!
  note: String
  changedAt: DateTime!
}

type SubmitApplicationPayload {
  jobApplication: JobApplication
  errors: [SubmitApplicationError!]
}

type SubmitInterviewFeedbackPayload {
  interview: Interview
  errors: [SubmitInterviewFeedbackError!]
}

interface Error {
  message: String!
}

union CloseJobPostingError = EntityNotFoundError | JobStatusError

union CreateCompanyError = DomainValidationError | DuplicateCompanyError

union CreateJobPostingError = DomainValidationError | EntityNotFoundError

union MoveApplicationError =
  | EntityNotFoundError
  | InvalidStageTransitionError
  | DomainValidationError

union PublishJobPostingError = EntityNotFoundError | JobStatusError

union RegisterCandidateError = DomainValidationError | DuplicateCandidateError

union ScheduleInterviewError =
  | EntityNotFoundError
  | ApplicationClosedError
  | DomainValidationError

union SubmitApplicationError =
  | EntityNotFoundError
  | JobStatusError
  | DuplicateApplicationError
  | DomainValidationError

union SubmitInterviewFeedbackError = EntityNotFoundError | DomainValidationError

input ApplicationStageOperationFilterInput {
  eq: ApplicationStage @cost(weight: "10")
  neq: ApplicationStage @cost(weight: "10")
  in: [ApplicationStage!] @cost(weight: "10")
  nin: [ApplicationStage!] @cost(weight: "10")
}

input BooleanOperationFilterInput {
  eq: Boolean @cost(weight: "10")
  neq: Boolean @cost(weight: "10")
}

input CandidateFilterInput {
  and: [CandidateFilterInput!]
  or: [CandidateFilterInput!]
  id: UuidOperationFilterInput
  fullName: StringOperationFilterInput
  email: StringOperationFilterInput
  headline: StringOperationFilterInput
  yearsOfExperience: IntOperationFilterInput
  skills: ListStringOperationFilterInput
  createdAt: DateTimeOperationFilterInput
}

input CandidateSortInput {
